name: reference-kospi

# 참고 지표(코스피)만 받아 둔다. 일별 기록(data/daily.json)은 건드리지 않는다.
on:
  schedule:
    - cron: '20 0,3,6 * * 1-5'   # 평일 09:20 · 12:20 · 15:20 KST
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: repo-data-commit
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 코스피 조회
        run: node scripts/record-reference.mjs
      - name: 기록 커밋
        run: |
          git config user.name "daily-record-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reference.json
          git diff --cached --quiet && exit 0
          git commit -m "reference kospi $(TZ=Asia/Seoul date '+%F %H:%M')"
          git pull --rebase
          git push
