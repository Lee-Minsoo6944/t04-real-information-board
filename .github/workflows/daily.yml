name: daily-record

on:
  schedule:
    - cron: '0 0 * * *'   # 매일 00:00 UTC = 09:00 KST
  workflow_dispatch: {}

concurrency:
  group: repo-data-commit
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 실제 공개 원천 조회 후 일별 기록
        run: node scripts/record-daily.mjs
      - name: 기록 커밋
        run: |
          git config user.name "daily-record-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "daily record $(TZ=Asia/Seoul date +%F)"
          git pull --rebase
          git push
